services:
  - type: web
    name: tumatrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tumatrack-db
          property: connectionString

databases:
  - name: tumatrack-db
    plan: free
    databaseName: tumatrack
    user: tumatrack
